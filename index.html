<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">

    <title>CV Pantoja - Inicio</title>

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <header id="cabecera"></header>

    <main class="container">

        <h1>Temporada 2026/2027</h1>

        <!-- Próximos partidos de cada equipo -->
        <section>
            <h2>Próximos partidos</h2>

            <div id="proximos-partidos" class="proximos-partidos">

                <div id="proximo-azul" class="proximo-partido equipo-azul">
                </div>

                <div id="proximo-oro" class="proximo-partido equipo-oro">
                </div>

            </div>
        </section>

        <!-- Todos los partidos pendientes -->
        <section>
            <h2>Todos los partidos pendientes</h2>

            <table class="tabla-jornada">
                <tbody id="pendientes"></tbody>
            </table>
        </section>

        <!-- Todos los partidos jugados -->
        <section>
            <h2>Partidos jugados</h2>

            <table class="tabla-jornada">
                <tbody id="jugados"></tbody>
            </table>
        </section>

        <p id="mensaje-error" class="mensaje-error" hidden></p>

    </main>

    <script src="js/comun.js" defer></script>
    <script src="js/datos.js" defer></script>
    <script src="js/index.js" defer></script>

</body>
</html>
