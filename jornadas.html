<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">

    <title>CV Pantoja - Jornadas</title>

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/jornadas.css">
</head>
<body>

    <header id="cabecera"></header>

    <main class="container">

        <h1>Calendario 2026/2027</h1>

        <!-- Filtros -->
        <section class="filtros-jornadas">

            <div class="filtro">
                <label for="filtro-jornada">Jornada</label>
                <select id="filtro-jornada">
                    <option value="todas">Todas las jornadas</option>
                </select>
            </div>

            <div class="filtro">
                <label for="filtro-equipo">Equipo</label>
                <select id="filtro-equipo">
                    <option value="todos">Todos los equipos</option>
                    <option value="oro">Pantoja Oro</option>
                    <option value="azul">Pantoja Azul</option>
                </select>
            </div>

            <div class="filtro">
                <label for="filtro-estado">Resultado</label>
                <select id="filtro-estado">
                    <option value="todos">Todos los partidos</option>
                    <option value="jugados">Jugados</option>
                    <option value="pendientes">Pendientes</option>
                </select>
            </div>

        </section>

        <div id="resultados" class="resultados"></div>

        <p id="mensaje-error" class="mensaje-error" hidden></p>

    </main>

    <script src="js/comun.js" defer></script>
    <script src="js/datos.js" defer></script>
    <script src="js/jornadas.js" defer></script>
</body>
</html>
