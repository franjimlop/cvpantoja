
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">

    <title>CV Pantoja - Clasificación</title>

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/clasificacion.css">
</head>
<body>

    <header id="cabecera"></header>

    <main class="container">

        <h1>Clasificación 2026/2027</h1>

        <table class="tabla-clasificacion">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Equipo</th>
                    <th>Pts</th>
                    <th>SF</th>
                    <th>SC</th>
                    <th>PF</th>
                    <th>PC</th>
                </tr>
            </thead>
            <tbody id="clasificacion"></tbody>
        </table>

        <div class="leyenda">
            <p><strong>Pos:</strong> Posición</p>
            <p><strong>Pts:</strong> Puntos</p>
            <p><strong>SF:</strong> Sets a favor</p>
            <p><strong>SC:</strong> Sets en contra</p>
            <p><strong>PF:</strong> Puntos a favor</p>
            <p><strong>PC:</strong> Puntos en contra</p>
        </div>

        <p id="mensaje-error" class="mensaje-error" hidden></p>

    </main>

    <script src="js/comun.js" defer></script>
    <script src="js/datos.js" defer></script>
    <script src="js/clasificacion.js" defer></script>
</body>
</html>
