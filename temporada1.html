
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">

    <title>CV Pantoja - Temporada 24/25</title>

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/temporadas.css">
</head>
<body>

    <header id="cabecera"></header>

    <main class="container" data-temporada="24_25">

        <h1>Temporada 2024/2025</h1>

        <section>
            <h2>Clasificación final</h2>

            <table class="tabla-clasificacion">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Equipo</th>
                        <th>PJ</th>
                        <th>PG</th>
                        <th>PP</th>
                        <th>SF</th>
                        <th>SC</th>
                    </tr>
                </thead>
                <tbody id="clasificacion"></tbody>
            </table>

            <div class="leyenda">
                <p><strong>PJ:</strong> Partidos jugados</p>
                <p><strong>PG:</strong> Partidos ganados</p>
                <p><strong>PP:</strong> Partidos perdidos</p>
                <p><strong>SF:</strong> Sets a favor</p>
                <p><strong>SC:</strong> Sets en contra</p>
            </div>
        </section>

        <section>
            <div id="todos-jugados"></div>
            <div id="jugados"></div>
        </section>

        <p id="mensaje-error" class="mensaje-error" hidden></p>

    </main>

    <script src="js/comun.js" defer></script>
    <script src="js/datos.js" defer></script>
    <script src="js/temporadas.js" defer></script>
</body>
</html>
